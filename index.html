<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIEGOMOTOPECAS - Motopeças & Acessórios</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col justify-between">

  <!-- CABEÇALHO / HEADER -->
  <header class="bg-zinc-950 border-b border-red-600/30 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-black tracking-wider text-red-500 uppercase">
        DIEGO<span class="text-white">MOTOPECAS</span>
      </h1>
      <button id="cart-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded flex items-center gap-2">
        🛒 Carrinho (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL / CATÁLOGO DE PRODUTOS -->
  <main class="max-w-6xl mx-auto p-6 w-full grow">
    <h2 class="text-xl font-bold mb-6 border-l-4 border-red-500 pl-3">Destaques do Catálogo</h2>
    
    <div id="produtos-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <!-- Exemplo de Card de Produto -->
      <div class="bg-zinc-800 border border-zinc-700 rounded-lg p-4 flex flex-col justify-between">
        <div>
          <div class="bg-zinc-700 h-40 rounded mb-4 flex items-center justify-center text-zinc-500">
            [ Foto da Peça ]
          </div>
          <h3 class="font-bold text-lg mb-1">Capacete Sport 60</h3>
          <p class="text-zinc-400 text-sm mb-3">Alta proteção e aerodinâmica para uso urbano e rodoviário.</p>
        </div>
        <div>
          <p class="text-red-400 font-extrabold text-xl mb-3">R$ 299,90</p>
          <button onclick="adicionarAoCarrinho('Capacete Sport 60', 299.90)" class="w-full bg-zinc-700 hover:bg-red-600 text-white font-bold py-2 rounded transition">
            Adicionar ao Carrinho
          </button>
        </div>
      </div>
    </div>

    <!-- ÁREA DE CHECKOUT / FORMULÁRIO -->
    <section id="checkout-section" class="mt-12 bg-zinc-800 border border-zinc-700 p-6 rounded-lg max-w-2xl mx-auto">
      <h2 class="text-xl font-bold mb-4 text-red-500">Finalizar Pedido</h2>
      
      <form id="form-checkout" onsubmit="finalizarCompra(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Nome Completo</label>
          <input type="text" id="cliente-nome" required class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 focus:outline-none focus:border-red-500">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Telefone / WhatsApp</label>
            <input type="tel" id="cliente-telefone" required class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 focus:outline-none focus:border-red-500">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">CPF</label>
            <input type="text" id="cliente-cpf" class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 focus:outline-none focus:border-red-500">
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">CEP</label>
            <input type="text" id="cliente-cep" class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 focus:outline-none focus:border-red-500">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium mb-1">Endereço de Entrega</label>
            <input type="text" id="cliente-endereco" required class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 focus:outline-none focus:border-red-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Forma de Pagamento</label>
          <select id="metodo-pagamento" class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 focus:outline-none focus:border-red-500">
            <option value="PIX">PIX</option>
            <option value="Cartão de Crédito">Cartão de Crédito</option>
            <option value="Dinheiro">Dinheiro na Entrega</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded text-lg transition">
          Confirmar e Enviar Pedido
        </button>
      </form>
    </section>
  </main>

  <!-- RODAPÉ / FOOTER -->
  <footer class="bg-zinc-950 border-t border-zinc-800 p-4 text-center text-zinc-500 text-sm">
    &copy; 2026 DIEGOMOTOPECAS. Todos os direitos reservados.
  </footer>

  <!-- LÓGICA JAVASCRIPT & SUPABASE -->
  <script>
    // 1. Configuração de credenciais do Supabase
    const SUPABASE_URL = 'https://ltvnmhskadamqnwmiwtj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0dm5taHNrYWRhbXFud21pd3RqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTUzNjUsImV4cCI6MjEwNTU5MTM2NX0.x1J0Si_Ikwy-sv2I-8oNP-DtYfvgrO5dNcymkgJ7j3A'; // Cole aqui sua Publishable Key completa

    // Inicialização do cliente Supabase
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Estado local do carrinho
    let carrinho = [];

    function adicionarAoCarrinho(nomeProduto, preco) {
      carrinho.push({ nome: nomeProduto, preco: preco });
      document.getElementById('cart-count').innerText = carrinho.length;
      alert(`${nomeProduto} adicionado ao carrinho!`);
    }

    // 2. Função de checkout para gravar dados no Supabase
    async function finalizarCompra(event) {
      event.preventDefault();

      if (carrinho.length === 0) {
        alert('Seu carrinho está vazio!');
        return;
      }

      const dadosCliente = {
        nome: document.getElementById('cliente-nome').value,
        telefone: document.getElementById('cliente-telefone').value,
        cpf: document.getElementById('cliente-cpf').value,
        cep: document.getElementById('cliente-cep').value,
        endereco: document.getElementById('cliente-endereco').value
      };

      const metodoPagamento = document.getElementById('metodo-pagamento').value;
      const totalPedido = carrinho.reduce((soma, item) => soma + item.preco, 0);

      try {
        // A. Inserir Cliente na tabela 'clientes'
        const { data: cliente, error: erroCliente } = await _supabase
          .from('clientes')
          .insert([dadosCliente])
          .select()
          .single();

        if (erroCliente) throw erroCliente;

        // B. Inserir Pedido na tabela 'pedidos' relacionando com o id do cliente
        const { data: pedido, error: erroPedido } = await _supabase
          .from('pedidos')
          .insert([
            {
              cliente_id: cliente.id,
              itens: carrinho,
              total: totalPedido,
              metodo_pagamento: metodoPagamento,
              status: 'Pendente'
            }
          ]);

        if (erroPedido) throw erroPedido;

        alert('Pedido realizado com sucesso e registrado no banco de dados!');
        carrinho = [];
        document.getElementById('cart-count').innerText = 0;
        document.getElementById('form-checkout').reset();

      } catch (err) {
        console.error('Erro ao salvar no Supabase:', err);
        alert('Ocorreu um erro ao processar o seu pedido. Tente novamente.');
      }
    }
  </script>
</body>
</html>
